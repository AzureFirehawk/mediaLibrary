{% extends 'library/base.html' %}

{% block content %}
<h2>{{ item.title }}</h2>

<p><strong>Creator:</strong> {{ item.creator }}</p>
<p><strong>Status:</strong> {{ item.get_status_display }}</p>

{% if item.notes %}
<p><strong>Notes:</strong><br>{{ item.notes }}</p>
{% endif %}

<a href="{% url 'library:media_list' %}">Back to list</a>
{% endblock %}
