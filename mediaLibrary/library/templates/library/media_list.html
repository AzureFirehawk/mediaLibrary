{% extends 'library/base.html' %}

{% block content %}
<h2>My Media</h2>

<!-- Filter by status or type -->
<form method="get">
  <label>
    Status:
    <select name="status">
      <option value="">All</option>
      <option value="wishlist" 
        {% if status_filter == 'wishlist' %}selected{% endif %}>
        Wishlist
      </option>
      <option value="in-progress" 
        {% if status_filter == 'in-progress' %}selected{% endif %}>
        In Progress
      </option>
      <option value="completed"
        {% if status_filter == 'completed' %}selected{% endif %}>
        Completed
      </option>
    </select>
  </label>

  <label>
    Type:
    <select name="type">
      <option value="">All</option>
      <option value="book" 
        {% if type_filter == 'book' %}selected{% endif %}>
        Book
      </option>
      <option value="movie"
        {% if type_filter == 'movie' %}selected{% endif %}>
        Movie
      </option>
      <option value="game"
        {% if type_filter == 'game' %}selected{% endif %}>
        Game
      </option>
      <option value="show"
        {% if type_filter == 'show' %}selected{% endif %}>
        TV Show
      </option>
      <option value="other"
        {% if type_filter == 'other' %}selected{% endif %}>
        Other
      </option>
    </select>
  </label>
  <button type="submit">Filter</button>
</form>
<hr>

<!-- List of media items -->
<ul>
  {% for item in items %}
  <li>
    <a href="{% url 'library:media_detail' item.pk %}">
      {{ item.title }}
    </a>
    — {{ item.creator }} ({{ item.get_type_display }}, {{ item.get_status_display }})
  </li>
  {% empty %}
  <li>No media items yet.</li>
  {% endfor %}
</ul>
{% endblock %}
